# Gaming Studio J reverse-proxy configuration for the existing
# v79_nginx_proxy container.
#
# Both v79_nginx_proxy and gaming-studio-j must be attached to proxy_network.
# The application listens on port 80 inside Docker. Do not proxy to host port 8095.

upstream gaming_studio_j_upstream {
    server gaming-studio-j:80;
    keepalive 16;
}

server {
    listen 80;
    server_name games.v79sl.com;

    access_log /var/log/nginx/gaming-studio-j.access.log;
    error_log  /var/log/nginx/gaming-studio-j.error.log warn;

    location = /healthz {
        proxy_pass http://gaming_studio_j_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://gaming_studio_j_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Safe for current static app and future WebSocket-enabled games.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
    }
}
