services:
  gaming-studio-j:
    container_name: gaming-studio-j
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "80"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}

    # Keep the existing internal route unchanged so v79_nginx_proxy
    # continues to reach http://gaming-studio-j:80 over proxy_network.
    expose:
      - "80"

    volumes:
      - gsj_runtime:/app/runtime

    networks:
      - proxy_network

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 8s

volumes:
  gsj_runtime:
    name: gaming_studio_j_runtime

networks:
  proxy_network:
    external: true
    name: proxy_network
