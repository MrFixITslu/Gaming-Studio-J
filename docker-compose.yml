services:
  gaming-studio-j:
    build: .
    restart: unless-stopped
    ports:
      - "${GAMES_BIND_ADDRESS:-0.0.0.0}:${GAMES_PORT:-8095}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
