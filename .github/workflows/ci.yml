name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/admin.js

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/catalog.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Verify required files
        run: |
          test -f index.html
          test -f admin.html
          test -f Dockerfile
          test -f docker-compose.yml
          test -f nginx.conf
          test -f games/mr-melons-adventure/index.html

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build container
        run: docker build -t gaming-studio-j:ci .
