name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check assets/app.js
          node --check assets/admin.js
          node --check assets/lobby.js
          node --check assets/admin-dashboard.js
          node --check assets/spelling-admin.js
          node --check games/spelling-bee/spelling-bee.js
          node --check scripts/gameplay-smoke.js
          node scripts/gameplay-smoke.js
          node --check sw.js
          node -e "const fs=require('fs');const html=fs.readFileSync('games/mr-melons-adventure/index.html','utf8');const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];for(const [,code] of scripts)new(require('vm').Script)(code);if(!scripts.length)process.exit(1)"

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/catalog.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "const m=JSON.parse(require('fs').readFileSync('games/mr-melons-adventure/manifest.webmanifest','utf8'));if(m.display!=='fullscreen'||m.orientation!=='landscape')process.exit(1)"

      - name: Verify required files
        run: |
          test -f index.html
          test -f admin.html
          test -f catalogue-admin.html
          test -f spelling-admin.html
          test -f lobby.html
          test -f server.js
          test -f package.json
          test -f assets/lobby.js
          test -f assets/admin-dashboard.js
          test -f assets/spelling-admin.js
          test -f assets/spelling-bee-icon.svg
          test -f assets/spelling-bee-cover.svg
          test -f Dockerfile
          test -f docker-compose.yml
          test -f nginx.conf
          test -f games/mr-melons-adventure/index.html
          test -f games/mr-melons-adventure/manifest.webmanifest
          test -f games/spelling-bee/index.html
          test -f games/spelling-bee/spelling-bee.css
          test -f games/spelling-bee/spelling-bee.js
          test -f games/spelling-bee/spelling-bee-hero.svg
          test -f games/spelling-bee/spelling-bee-player.svg
          test -f games/spelling-bee/spelling-bee-world.svg

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application container
        run: docker build -t gaming-studio-j:ci .

      - name: Verify container can serve game pages
        run: |
          docker run -d --name gaming-studio-j-ci -p 18080:80 gaming-studio-j:ci
          trap 'docker logs gaming-studio-j-ci || true; docker rm -f gaming-studio-j-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/games/spelling-bee/index.html >/dev/null
          curl -fsS http://127.0.0.1:18080/games/mr-melons-adventure/index.html >/dev/null
          docker exec gaming-studio-j-ci sh -c 'test -r /app/games/spelling-bee/index.html && test -r /app/games/mr-melons-adventure/index.html'
